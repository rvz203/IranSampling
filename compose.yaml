services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sampling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sampling
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampling -d sampling"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [sampling]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sampling:${POSTGRES_PASSWORD}@database:5432/sampling?sslmode=disable
      API_PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
      UPLOAD_DIR: /data/uploads
      MAP_DATA_DIR: /data/maps
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - evidence_data:/data/uploads
      - type: bind
        source: ${MAP_DATA_HOST_DIR:-./.local/maps}
        target: /data/maps
        read_only: true
    depends_on:
      database:
        condition: service_healthy
    networks: [sampling]
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    depends_on: [api]
    networks: [sampling]
volumes:
  postgres_data:
  evidence_data:
networks:
  sampling:
